services:
  mysql-ipss:
    image: mysql:8.0
    container_name: mysql-ipss
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ipss_practicas_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_ipss_data:/var/lib/mysql

volumes:
  mysql_ipss_data:
